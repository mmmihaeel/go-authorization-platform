global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: authz-api
    metrics_path: /metrics
    static_configs:
      - targets: [authz-api:8080]
  - job_name: openfga
    static_configs:
      - targets: [openfga:2112]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
