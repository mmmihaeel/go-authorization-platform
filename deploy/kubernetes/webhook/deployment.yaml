apiVersion: v1
kind: Namespace
metadata: { name: authz-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-admission
  namespace: authz-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: authorization-admission }
  template:
    metadata:
      labels: { app: authorization-admission }
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: webhook
          image: ghcr.io/mmmihaeel/go-authorization-platform-admission:0.1.0
          args: []
          ports: [{ name: https, containerPort: 8443 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { scheme: HTTPS, path: /health/live, port: https }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: tls
          secret: { secretName: authorization-admission-tls }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-admission
  namespace: authz-system
spec:
  selector: { app: authorization-admission }
  ports: [{ name: https, port: 443, targetPort: https }]
